<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Products - FixIt Store</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="index.css" />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <!-- ================= NAVBAR ================= -->
    <header class="navbar" id="navbar">
      <div class="nav-container">
        <a href="/index.html" class="logo">
          <span class="logo-diamond">◆</span>
          <span class="logo-text">LUXORA<small>STORE</small></span>
        </a>

        <nav class="nav-links" id="navLinks">
          <a href="WomenClothes.html">Female</a>

          <a href="/jewelery.html">Jewelery</a>
          <a href="/Electronic.html">Electronics</a>
          <a href="/All_Product.html">All Products</a>
        </nav>

        <div class="nav-actions">
          <button class="icon-btn" aria-label="Account">
            <i class="fas fa-user"></i>
          </button>

          <button class="icon-btn cart-btn" aria-label="Cart">
            <i class="fas fa-shopping-bag"></i>
            <span class="cart-badge">2</span>
          </button>
          <button class="hamburger" id="hamburger" aria-label="Menu">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </header>

    <!-- ================= MOBILE SIDEBAR ================= -->
    <aside class="mobile-sidebar" id="mobileSidebar">
      <!-- Sidebar Header -->
      <div class="sidebar-header">
        <img src="assets/logo.png" alt="Logo" />
        <button class="close-btn" id="closeBtn" aria-label="Close menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Sidebar Links -->
      <div class="sidebar-links">
        <a href="All_Product.html">
          All Products
          <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="jewelery.html">
          Jewelery
          <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="Electronic.html">
          Electronic
          <i class="fa-solid fa-chevron-right"></i>
        </a>
        <a href="WomenClothes.html">
          Women Clothes
          <i class="fa-solid fa-chevron-right"></i>
        </a>
      </div>

      <!-- Sidebar Account -->
      <div class="sidebar-account">
        <a href="#" class="sidebar-login">Login</a>
        <a href="#" class="sidebar-register">Register</a>
      </div>
    </aside>

    <!-- OVERLAY -->
    <div class="menu-overlay" id="menuOverlay"></div>

    <!-- ================= CART SIDEBAR ================= -->
    <aside class="cart-sidebar" id="cartSidebar">
      <div class="sidebar-header">
        <h2>Shopping Cart <span id="cartHeaderCount">(0)</span></h2>
        <button class="close-btn" id="closeCartBtn" aria-label="Close cart">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="cart-body" id="cartItemsContainer">
        <!-- Dynamic Cart Items -->
      </div>

      <div class="cart-footer">
        <div class="cart-total-row">
          <span>Total Amount:</span>
          <span class="cart-total-price" id="cartTotalPrice">$0.00</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn">
          Proceed to Checkout
        </button>
      </div>
    </aside>

    <div class="cart-overlay" id="cartOverlay"></div>

    <div class="page-header">
      <h1 class="page-title">All Products</h1>
    </div>

    <div class="Product-Container" data-category="all"></div>
    <footer class="footer">
      <div class="footer-top">
        <div class="footer-brand">
          <div class="logo">
            <span class="logo-diamond">◆</span>
            <span class="logo-text">LUXORA<small>STORE</small></span>
          </div>

          <div class="social-links">
            <a href="#" aria-label="Facebook"
              ><i class="fab fa-facebook-f"></i
            ></a>
            <a href="#" aria-label="Instagram"
              ><i class="fab fa-instagram"></i
            ></a>
            <a href="#" aria-label="Pinterest"
              ><i class="fab fa-pinterest-p"></i
            ></a>
            <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
          </div>
        </div>

        <div class="footer-links">
          <h4>Shop</h4>
          <ul>
            <li>
              <a href="/All_Product.html">All Products</a>
            </li>
          </ul>
        </div>

        <div class="footer-links">
          <h4>Customer Service</h4>
          <ul>
            <li><a href="#">FAQ</a></li>
          </ul>
        </div>

        <div class="footer-links">
          <h4>About Us</h4>
          <ul>
            <li><a href="#">Our Story</a></li>
          </ul>
        </div>

        <div class="footer-links">
          <h4>Contact Us</h4>
          <ul>
            <li><i class="fas fa-envelope"></i> devqai49@gmail.com</li>
          </ul>
        </div>
      </div>
    </footer>
    <script src="index.js"></script>
    <script src="app.js"></script>
  </body>
</html>
